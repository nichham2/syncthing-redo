name: Build Keepsake

# Builds everything needed to install Keepsake on your devices and uploads
# it as downloadable artifacts (Actions tab -> this workflow -> a run ->
# "Artifacts"):
#   keepsake-android-apk     installable debug APK for Android phones
#   keepsake-hub-<platform>  the always-on computer / NAS ("hub")
#   keepsake-ios-unsigned-ipa  iPhone app, unsigned. Install it from Windows
#                            or Linux with a sideloading tool (Sideloadly,
#                            AltStore) and a free Apple ID; see mobile/INSTALL.md
#
# With a paid Apple Developer account and the secrets described in
# mobile/INSTALL.md, the ios-testflight job also signs the iPhone app and
# uploads it to TestFlight, so no Mac is needed at any point.

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload the iPhone app to TestFlight (needs the Apple secrets)
        type: boolean
        default: false
  pull_request:
    paths:
      - "lib/**"
      - "internal/**"
      - "gui/default/mobile/**"
      - "mobile/**"
      - ".github/workflows/build-keepsake.yaml"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "internal/**"
      - "gui/default/mobile/**"
      - "mobile/**"
      - ".github/workflows/build-keepsake.yaml"

permissions:
  contents: read

jobs:
  hub:
    name: Hub (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go run build.go -goos ${{ matrix.goos }} -goarch ${{ matrix.goarch }} -no-upgrade build syncthing
      - name: Package
        run: |
          mkdir -p dist
          bin=syncthing; [ "${{ matrix.goos }}" = windows ] && bin=syncthing.exe
          out=keepsake-hub; [ "${{ matrix.goos }}" = windows ] && out=keepsake-hub.exe
          cp "$bin" "dist/$out"
          cp mobile/INSTALL.md LICENSE dist/
      - uses: actions/upload-artifact@v4
        with:
          name: keepsake-hub-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build sync engine (.aar)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: mobile/build-bridge.sh android
      - name: Build APK
        working-directory: mobile/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: keepsake-android-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build sync engine (.xcframework)
        run: mobile/build-bridge.sh ios
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: |
          brew install xcodegen
          xcodegen
      - name: Build for simulator (compile check)
        working-directory: mobile/ios
        run: |
          xcodebuild -project Keepsake.xcodeproj -scheme Keepsake \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Build for iPhone (unsigned)
        working-directory: mobile/ios
        run: |
          xcodebuild -project Keepsake.xcodeproj -scheme Keepsake \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/Keepsake.app ipa/Payload/
          (cd ipa && zip -qry ../Keepsake-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: keepsake-ios-unsigned-ipa
          path: mobile/ios/Keepsake-unsigned.ipa

  # Signs the app with your Apple Developer account and uploads it to
  # TestFlight. Runs on pushes to main and on manual runs with "testflight"
  # ticked, and only when the ASC_* and APPLE_TEAM_ID secrets are set.
  # Xcode creates the distribution certificate and profile itself
  # (cloud-managed signing), so the API key needs the Admin role.
  ios-testflight:
    name: iOS (TestFlight)
    runs-on: macos-15
    if: github.event_name == 'push' || inputs.testflight
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'app.keepsake.photos' }}
    steps:
      - name: Check for Apple secrets
        id: check
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight upload skipped: set ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID (see mobile/INSTALL.md)."
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
      - uses: actions/setup-go@v5
        if: steps.check.outputs.enabled == 'true'
        with:
          go-version-file: go.mod
      - name: Build sync engine (.xcframework)
        if: steps.check.outputs.enabled == 'true'
        run: mobile/build-bridge.sh ios
      - name: Generate Xcode project
        if: steps.check.outputs.enabled == 'true'
        working-directory: mobile/ios
        run: |
          brew install xcodegen
          xcodegen
      - name: Archive, sign and upload to TestFlight
        if: steps.check.outputs.enabled == 'true'
        working-directory: mobile/ios
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$key"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          xcodebuild -project Keepsake.xcodeproj -scheme Keepsake \
            -destination 'generic/platform=iOS' -configuration Release \
            -archivePath build/Keepsake.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${auth[@]}" archive

          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath build/Keepsake.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            "${auth[@]}"
          rm -f "$key"
